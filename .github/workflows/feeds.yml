name: PM Hub Feeds

on:
  schedule:
    # Twice daily at 09:00 and 21:00 UTC = ~1-2 AM and ~1-2 PM Pacific
    # (1 AM/PM during PST, 2 AM/PM during PDT — GitHub cron is UTC, no DST).
    # Same rhythm as WebinarHub. Minute 17 instead of :00 to avoid the
    # top-of-hour queue on GitHub's shared runners.
    - cron: '17 9,21 * * *'
  workflow_dispatch:   # "Run workflow" button for a manual refresh

permissions:
  contents: read       # nothing is committed back; the Google Sheet is the memory

concurrency:
  group: pm-hub-feeds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser tests (offline, against saved pages)
        run: python -m pytest -q

      - name: Collect feeds and merge into the Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          # Optional — put a contact email in the User-Agent (recommended).
          FEEDS_CONTACT: ${{ vars.FEEDS_CONTACT }}
          # Optional — enables the full YouTube video list (see SETUP.md Part E).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m src.main

      # main.py also writes this run's tables to out/ (no extra requests).
      # Kept for 14 days — handy for debugging or a manual Coda import.
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-hub-feeds-${{ github.run_number }}
          path: out/
          retention-days: 14
