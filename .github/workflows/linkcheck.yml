name: PM Hub Weekly Health Check

on:
  schedule:
    # Mondays 15:23 UTC = 8:23 AM Pacific (7:23 during PST). A failed run means
    # a broken link or a stalled source, and GitHub emails the repo's watchers.
    - cron: '23 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm-hub-linkcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check links and source freshness
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          FEEDS_CONTACT: ${{ vars.FEEDS_CONTACT }}
          # Optional: read the live hub instead of data/hub_links.csv (SETUP Part G)
          CODA_API_TOKEN: ${{ secrets.CODA_API_TOKEN }}
          CODA_DOC_ID: ${{ vars.CODA_DOC_ID }}
          # Optional: let Claude judge pages that load but look off (SETUP Part H)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.linkcheck

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-hub-health-${{ github.run_number }}
          path: |
            out/link_health.csv
            out/health_checks.csv
            out/health_report.md
          retention-days: 30
